<title>룬 대장간</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gothic+A1:wght@400;600;800&family=Press+Start+2P&display=swap">
<style>
/* Layout: one screen, no page scroll. The night forge canvas fills the whole stage; status chips sit on the sky, every control sits on the wooden deck below the forge. Single committed night look. */
:root{
  color-scheme:dark;
  --night:#0c1730; --deep:#070d1e; --panel:#16223f; --panel-hi:#22325a;
  --wood:#5a3628; --wood-hi:#8a5639;
  --lantern:#ffb347; --ember:#ff6b3d; --teal:#3fc1b0; --gold:#ffd23d;
  --paper:#f6e7c8; --mute:#9fb0d0; --slate:#56627f; --crack:#c46be0; --danger:#ef5350;
  --glass:rgba(7,13,30,.78);
  --f-display:"Do Hyeon","Gothic A1","Malgun Gothic",sans-serif;
  --f-body:"Gothic A1","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --f-num:"Press Start 2P","Do Hyeon",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--deep);color:var(--paper);font-family:var(--f-body);font-size:14px;line-height:1.4;overflow:hidden}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--teal);outline-offset:1px}
h1,h2{font-family:var(--f-display);font-weight:400;margin:0}
h2{font-size:22px;color:var(--lantern)}

.game{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;background:var(--night)}
#scene{position:absolute;inset:0;width:100%;height:100%}
.hud{position:absolute;inset:0;display:flex;flex-direction:column;gap:6px;padding-block:8px 10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud{pointer-events:none}
.tophud,.deckui{pointer-events:auto}
.tag{position:absolute;z-index:2;transform:translate(-50%,-100%);background:var(--glass);border:2px solid var(--panel-hi);color:var(--paper);font-size:11px;font-weight:800;padding:2px 6px;white-space:nowrap}
.tag.on{border-color:var(--lantern);color:var(--lantern)}
.tophud{display:flex;flex-direction:column;gap:6px}
.top{display:flex;align-items:center;gap:8px}
.top h1{font-size:22px;color:var(--lantern);text-shadow:2px 2px 0 var(--deep);margin-right:auto}
.purse{display:flex;align-items:center;gap:6px;background:var(--deep);border:2px solid var(--wood-hi);padding:5px 8px;font-family:var(--f-num);font-size:12px;color:var(--gold);font-variant-numeric:tabular-nums}
.coin{width:10px;height:10px;background:var(--gold);box-shadow:inset -2px -2px 0 #c58a1a}
.ghost{background:var(--glass);border:2px solid var(--panel-hi);padding:6px 8px;color:var(--paper);font-size:12px}
.ghost:disabled{opacity:.45;cursor:not-allowed}
.status{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin:0}
.status div{background:var(--glass);border:2px solid var(--deep);padding:3px 5px;min-width:0}
.status dt{color:var(--mute);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status dd{margin:0;font-weight:800;font-size:12px;display:flex;gap:3px;align-items:center;min-height:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pip{width:8px;height:8px;border:2px solid var(--lantern);flex:0 0 auto}
.pip.on{background:var(--lantern)}
.pip.h{border-color:var(--danger)}
.pip.h.on{background:var(--danger)}

.artgap{position:relative;flex:1 1 0;min-height:0}
.banner{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-family:var(--f-display);font-size:clamp(30px,10vw,52px);
  text-shadow:3px 0 0 var(--deep),-3px 0 0 var(--deep),0 3px 0 var(--deep),0 -3px 0 var(--deep),3px 3px 0 var(--deep);animation:pop .7s steps(6) both}
@keyframes pop{0%{transform:scale(.4);opacity:0}30%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
.k-great3,.k-great2{color:var(--gold)} .k-up{color:var(--teal)} .k-keep{color:var(--mute)} .k-down{color:var(--crack)} .k-destroy{color:var(--danger)} .k-saved,.k-sell{color:var(--lantern)}

.deckui{display:flex;flex-direction:column;gap:6px}
.swrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;background:var(--glass);border:2px solid var(--deep);padding:6px}
#sword{width:56px;height:120px;background:radial-gradient(circle at 50% 45%,#2c3d6e,#0f1833);border:2px solid var(--deep)}
.dexh{font-weight:800;font-size:13px}
.dexrow{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px}
.dexrow canvas{width:100%;height:auto;background:#0f1833}
.coach{position:absolute;left:0;right:0;top:0;pointer-events:auto;background:rgba(7,13,30,.93);border:2px solid var(--lantern);padding:6px 8px;display:flex;gap:8px;align-items:center}
.coach p{margin:0;font-size:12px;font-weight:600;flex:1 1 0;min-width:0}
.hint{outline:3px solid var(--gold);outline-offset:2px;animation:hint 1s steps(2) infinite}
@keyframes hint{50%{outline-color:transparent}}
.swinfo{display:flex;flex-direction:column;gap:3px;min-width:0}
.lvrow{display:flex;align-items:baseline;gap:8px;min-width:0}
.lv{font-family:var(--f-num);font-size:19px;color:var(--gold);flex:0 0 auto}
.nm{font-family:var(--f-display);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.val{color:var(--mute);font-size:12px}
.val b{color:var(--paper);font-variant-numeric:tabular-nums}
.reels{display:flex;gap:8px}
.reel{flex:1 1 0;min-width:0;max-width:92px;aspect-ratio:1;height:auto;border:2px solid var(--deep);box-shadow:0 0 0 2px var(--wood-hi)}
.chance{display:flex;flex-direction:column;gap:4px}
.bar{display:flex;height:10px;border:2px solid var(--deep);background:var(--deep)}
.bar i{display:block;height:100%}
.chance-t{margin:0;display:flex;flex-wrap:wrap;gap:0 10px;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;text-shadow:1px 1px 0 var(--deep)}
.result{margin:0;min-height:2.8em;font-size:12px;font-weight:600;text-shadow:1px 1px 0 var(--deep);color:var(--paper)}
.row{display:flex;gap:6px}
.btn{flex:1 1 0;min-width:0;font-family:var(--f-display);font-size:17px;border:2px solid var(--deep);padding:6px;color:var(--deep);background:var(--lantern);box-shadow:0 4px 0 #a35a1c;display:flex;flex-direction:column;align-items:center;line-height:1.15}
.btn small{font-family:var(--f-body);font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.btn.big{flex:1.6 1 0}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:none}
.btn.sell{background:#ffe08a;box-shadow:0 4px 0 #a8811f}
.btn.hide{background:var(--teal);box-shadow:0 4px 0 #1f7a6e}
.btn.end{background:#33405c;color:var(--paper);box-shadow:0 4px 0 #1a2238}
.btn:disabled{background:var(--slate);box-shadow:0 4px 0 #303a52;color:#c3cce0;cursor:not-allowed}
.rack{display:flex;align-items:center;gap:8px;min-height:26px;min-width:0}
.tix{flex:0 0 auto;color:var(--mute);font-size:12px;font-weight:800;text-shadow:1px 1px 0 var(--deep)}
.cellar{list-style:none;margin:0;padding:0;display:flex;gap:6px;overflow-x:auto;min-width:0}
.cellar li{flex:0 0 auto;white-space:nowrap;background:var(--glass);border:2px solid var(--teal);padding:2px 6px;font-size:11px;display:flex;gap:6px;align-items:center}
.cellar li{padding:0;border:0;background:none}
.chip{background:var(--glass);border:2px solid var(--teal);color:var(--paper);padding:2px 5px;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.chip canvas{width:22px;height:47px}
.chip span{font-size:10px;font-weight:800}
.cellar li.slot{width:36px;height:62px;border:2px dashed var(--panel-hi)}
.chip:disabled{opacity:.5}
.nav .ghost{flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.daychip{font-weight:800;font-size:13px;background:var(--glass);border:2px solid var(--deep);padding:4px 8px;white-space:nowrap}
.cards{display:grid;grid-template-columns:1.2fr 1fr 1.2fr;gap:4px}
.card{background:var(--glass);border:2px solid var(--deep);padding:4px 6px;min-width:0;display:flex;flex-direction:column;gap:2px}
.cl{color:var(--mute);font-size:10px;font-weight:800;white-space:nowrap}
.card canvas{image-rendering:pixelated;align-self:flex-start}
#cvStock{width:100%;max-width:103px;height:auto}
#cvKid{width:64px;height:16px;margin-block:3px}
.cs{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv2{display:flex;flex-direction:column;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.kingcap{color:#ff5a5a;font-size:24px}
.ov.tree{display:flex;flex-direction:column;gap:8px;place-items:stretch;overflow:hidden}
.treehead{display:flex;align-items:center;gap:8px}
.treehead h2{margin-right:auto}
.board{flex:1 1 0;min-height:0;overflow:auto;border:3px solid var(--deep);background:#080d1f;box-shadow:inset 0 0 0 2px var(--panel-hi)}
.boardin{position:relative;width:1400px;height:1400px;background-image:radial-gradient(#1a2444 1px,transparent 1px);background-size:28px 28px}
.nd{position:absolute;width:46px;height:46px;transform:translate(-50%,-50%);border:3px solid #232c47;background:#0f1833;color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:0}
.nd b{font-family:var(--f-display);font-weight:400;font-size:17px}
.nd small{font-size:10px;font-weight:800;color:var(--mute)}
.nd.lock{opacity:.35}
.nd.av{border-style:dashed;background:#16223f}
.nd.own{background:#22325a}
.nd.max{background:#3d3115;box-shadow:0 0 0 2px var(--gold)}
.nd.sel{outline:3px solid var(--paper);outline-offset:2px}
.nodeinfo{display:flex;flex-direction:column;gap:6px;background:var(--panel);border:3px solid var(--deep);padding:10px}
.nodeinfo .btn{flex:0 0 auto}
.ni-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ni-h strong{font-family:var(--f-display);font-weight:400;font-size:19px;color:var(--lantern)}
.ni-h span{font-size:12px;color:var(--mute);font-weight:800}
/* sheets and night overlays */
.ov{position:fixed;inset:0;z-index:50;background:rgba(5,9,22,.95);display:grid;place-items:center;overflow:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ovbox{width:100%;max-width:480px;display:flex;flex-direction:column;gap:12px}
.ovbox canvas{max-width:100%}
.ovbox>canvas{width:100%;aspect-ratio:200/112;height:auto;border:3px solid var(--deep);box-shadow:0 0 0 3px var(--wood)}
.ovbox h2{font-size:26px}
.ovbox p{margin:0}
.ovbox>.btn{flex:0 0 auto}
.panel{background:var(--panel);border:3px solid var(--deep);box-shadow:inset 0 0 0 3px var(--panel-hi);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.cap{font-family:var(--f-display);font-size:20px;min-height:3.2em;text-wrap:balance}
.ovlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ovlist li{padding-left:10px;border-left:3px solid var(--slate)}
.note{margin:0;color:var(--mute);font-size:13px}
.odds{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.odds li{display:grid;grid-template-columns:12px 58px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px}
.sw{width:12px;height:12px}
.combo{display:flex;gap:2px}
.mini{width:18px;height:18px}
.pct{font-variant-numeric:tabular-nums;font-weight:800;text-align:right}
.shop{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.shop li{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center}
.ico{width:36px;height:36px;background:var(--deep)}
.shop strong{font-family:var(--f-display);font-weight:400;font-size:17px;display:block}
.shop span{color:var(--mute);font-size:13px;display:block}
.buy{background:var(--deep);border:2px solid var(--wood-hi);padding:5px 8px;font-family:var(--f-num);font-size:10px;color:var(--gold);white-space:nowrap}
.buy:disabled{opacity:.4;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0}
.stats div{background:var(--deep);padding:8px}
.stats dt{color:var(--mute);font-size:12px}
.stats dd{margin:0;font-weight:800;font-variant-numeric:tabular-nums}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.log li{padding-left:10px;border-left:3px solid var(--slate);overflow-wrap:anywhere;color:var(--paper)}
.log .k-great3,.log .k-great2{border-color:var(--gold)} .log .k-up{border-color:var(--teal)} .log .k-down{border-color:var(--crack)} .log .k-destroy{border-color:var(--danger)} .log .k-saved,.log .k-sell{border-color:var(--lantern)}
.hp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px;align-items:center;font-size:13px}
.hpbar{height:14px;background:var(--deep);border:3px solid var(--deep);box-shadow:0 0 0 2px var(--panel-hi)}
.hpbar i{display:block;height:100%;width:100%;background:var(--teal)}
@media (max-height:700px){#sword{width:42px;height:90px}.reel{max-width:50px}.chip canvas{width:16px;height:34px}.cellar li.slot{height:46px}.btn{font-size:15px;padding:4px 6px}.result{min-height:1.4em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
@media (prefers-reduced-motion:reduce){.banner,.hint{animation:none}}
</style>

<div class="game">
  <canvas id="scene" width="200" height="112" aria-label="밤의 대장간. 모루 위에 검이 놓여 있고 대장장이가 망치를 들고 있다."></canvas>
  <button id="tagMer" class="tag" data-open="shTree">상인</button>
  <button id="tagLet" class="tag" data-open="shLetter">딸의 편지</button>
  <div class="hud">
    <div class="tophud">
      <header class="top">
        <h1>룬 대장간</h1>
        <span class="daychip" id="stDay"></span>
        <div class="purse" title="크레딧"><span class="coin"></span><span id="credits">0</span></div>
        <button id="mute" class="ghost" aria-pressed="false">소리 켜짐</button>
      </header>
      <div class="cards">
        <div class="card"><span class="cl">오늘 강화할 검</span><canvas id="cvStock" width="56" height="12" aria-hidden="true"></canvas><span class="cs" id="stStockT"></span></div>
        <div class="card"><span class="cl">딸의 목숨</span><canvas id="cvKid" width="32" height="8" aria-hidden="true"></canvas><span class="cs" id="stKidT"></span></div>
        <div class="card" id="cardNight"><span class="cl">오늘 밤</span><div class="cv2" id="stNight"></div></div>
      </div>
    </div>
    <div class="artgap"><div id="banner" class="banner" hidden></div><div class="coach" id="coach" hidden><p id="coachT"></p><button id="coachX" class="ghost">안내 끄기</button></div></div>
    <div class="deckui">
      <div class="swrow">
        <canvas id="sword" width="28" height="60" aria-hidden="true"></canvas>
        <div class="swinfo">
          <div class="lvrow"><span class="lv" id="lv">+0</span><span class="nm" id="nm">녹슨 검</span></div>
          <div class="val">지금 팔면 <b id="sellv">0</b> 크레딧</div>
          <div class="reels" id="reels">
            <canvas class="reel" width="20" height="20"></canvas>
            <canvas class="reel" width="20" height="20"></canvas>
            <canvas class="reel" width="20" height="20"></canvas>
          </div>
        </div>
      </div>
      <div class="chance"><div class="bar" aria-hidden="true"><i id="mG" style="background:var(--gold)"></i><i id="mU" style="background:var(--teal)"></i><i id="mK" style="background:var(--slate)"></i><i id="mX" style="background:var(--danger)"></i></div><p class="chance-t" id="mTxt" aria-label="이번 강화 확률"></p></div>
      <p id="result" class="result" aria-live="polite"></p>
      <div class="row">
        <button id="bEnh" class="btn big"><span>강화하기</span><small id="bEnhS"></small></button>
        <button id="bEnd" class="btn end"><span>다음 날로</span><small id="bEndS"></small></button>
      </div>
      <div class="row">
        <button id="bSell" class="btn sell"><span id="bSellT">암시장에 팔기</span><small id="bSellS"></small></button>
        <button id="bHide" class="btn hide"><span>방어용 보관</span><small id="bHideS"></small></button>
      </div>
      <div class="rack"><span class="tix" id="celCap"></span><ul class="cellar" id="cellar"></ul></div>
      <div class="row nav">
        <button class="ghost" data-open="shOdds">룬 조합표</button>
        <button class="ghost" data-open="shTree">스킬 트리</button>
        <button class="ghost" data-open="shLog">도감·일지</button>
      </div>
    </div>
  </div>
</div>

<div class="ov" id="shOdds" hidden><div class="ovbox">
  <section class="panel">
    <h2>룬 조합표</h2>
    <div class="bar" aria-hidden="true"><i id="sgG" style="background:var(--gold)"></i><i id="sgU" style="background:var(--teal)"></i><i id="sgK" style="background:var(--slate)"></i><i id="sgX" style="background:var(--danger)"></i></div>
    <ul class="odds">
      <li><i class="sw" style="background:var(--gold)"></i><span class="combo"><canvas class="mini" data-spr="star" width="12" height="12"></canvas><canvas class="mini" data-spr="star" width="12" height="12"></canvas><canvas class="mini" data-spr="star" width="12" height="12"></canvas></span><span><b>대강화 +4</b> 별 셋</span><span class="pct" id="pG3"></span></li>
      <li><i class="sw" style="background:var(--gold)"></i><span class="combo"><canvas class="mini" data-spr="flame" width="12" height="12"></canvas><canvas class="mini" data-spr="flame" width="12" height="12"></canvas><canvas class="mini" data-spr="flame" width="12" height="12"></canvas></span><span><b>대강화 +2</b> 불꽃 셋 또는 망치 셋</span><span class="pct" id="pG2"></span></li>
      <li><i class="sw" style="background:var(--teal)"></i><span class="combo"><canvas class="mini" data-spr="flame" width="12" height="12"></canvas><canvas class="mini" data-spr="hammer" width="12" height="12"></canvas><canvas class="mini" data-spr="star" width="12" height="12"></canvas></span><span><b>강화 +1</b> 길조(불꽃·망치·별)만 셋</span><span class="pct" id="pU"></span></li>
      <li><i class="sw" style="background:var(--slate)"></i><span class="combo"><canvas class="mini" data-spr="flame" width="12" height="12"></canvas><canvas class="mini" data-spr="stone" width="12" height="12"></canvas><canvas class="mini" data-spr="hammer" width="12" height="12"></canvas></span><span><b>유지</b> 그 밖의 조합</span><span class="pct" id="pK"></span></li>
      <li><i class="sw" style="background:var(--danger)"></i><span class="combo"><canvas class="mini" data-spr="skull" width="12" height="12"></canvas><canvas class="mini" data-spr="skull" width="12" height="12"></canvas><canvas class="mini" data-spr="stone" width="12" height="12"></canvas></span><span><b>파괴</b> 해골 둘 이상</span><span class="pct" id="pX"></span></li>
    </ul>
    <p class="note" id="oddsNote"></p>
  </section>
  <button class="btn end" data-close><span>닫기</span></button></div></div>
<div class="ov tree" id="shTree" hidden>
  <div class="treehead"><h2>스킬 트리</h2><div class="purse"><span class="coin"></span><span id="trCr">0</span></div><button class="ghost" data-close>닫기</button></div>
  <p class="note" id="shopNote"></p>
  <div class="board" id="board"><div class="boardin" id="boardin"></div></div>
  <div class="nodeinfo" id="nodeinfo"></div>
</div>
<div class="ov" id="shLog" hidden><div class="ovbox">
  <section class="panel">
    <h2>검 도감</h2>
    <div id="dexGrid" style="display:flex;flex-direction:column;gap:6px"></div>
    <button id="dexAll" class="ghost">전체 디자인 미리보기</button>
    <p class="note" id="celNote"></p>
  </section>
  <section class="panel">
    <h2>대장간 일지</h2>
    <dl class="stats">
      <div><dt>최고 강화</dt><dd id="sBest"></dd></div>
